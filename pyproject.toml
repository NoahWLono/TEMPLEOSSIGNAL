[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temple-signal"
version = "0.1.0"
description = "A HolyC Signal text terminal for stock TempleOS with a local serial bridge"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "TEMPLEOSSIGNAL contributors"}]
readme = "README.md"
dependencies = []

[project.scripts]
temple-signal = "temple_signal.__main__:main"

[tool.setuptools.packages.find]
include = ["temple_signal*"]
