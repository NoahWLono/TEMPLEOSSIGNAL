name: Host and native TempleOS tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run bridge and adapter tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify RedSea media and QEMU launcher
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q temple_signal scripts
      - name: Build TempleOS source distribution
        run: python3 scripts/build_media.py

  native-templeos:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install headless QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Download original TempleOS boot image
        run: >-
          curl --fail --location --proto '=https' --tlsv1.2
          --retry 3 --connect-timeout 20 --max-time 90
          --output /tmp/TempleOS.ISO
          https://templeos.org/Downloads/TempleOS.ISO
      - name: Verify ISO hash and execute native HolyC tests
        run: >-
          python3 scripts/smoke_qemu.py
          --templeos-iso /tmp/TempleOS.ISO
          --boot-wait 30 --timeout 120
          --output-dir build/native-smoke
      - name: Preserve native guest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-templeos-smoke
          path: build/native-smoke/
          if-no-files-found: ignore
          retention-days: 14
